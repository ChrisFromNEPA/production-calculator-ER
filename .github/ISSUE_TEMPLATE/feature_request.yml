name: Feature request
description: Suggest a focused improvement that fits the local-first calculator.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        The public application is static and local-first. Requests for accounts, shared databases, analytics, or remote synchronization need a separate architecture discussion.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user task or pain point is not served today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change from a user's perspective.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other approaches did you try?
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Include screenshots, examples, public sources, or a sanitized sample.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private player data, and unsanitized workspace exports.
          required: true
