name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests and production build
        run: npm run check
      - name: Enforce asset provenance
        run: npm run assets:check
      - name: Enforce binary growth policy
        env:
          BINARY_HYGIENE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run assets:hygiene -- --base "$BINARY_HYGIENE_BASE_SHA"
      - name: Audit all dependencies for known vulnerabilities
        run: npm audit --include=dev
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  service-worker-browser:
    name: Chromium service-worker lifecycle
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install --yes chromium
      - name: Run clean-profile service-worker browser tests
        env:
          CHROMIUM_BIN: /usr/bin/chromium
        run: npm run test:sw-update

  calculator-browser-ux:
    name: Chromium calculator UX
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install --yes chromium
      - name: Run calculator browser UX tests
        env:
          BROWSER_TEST_REQUIRED: '1'
          CHROMIUM_BIN: /usr/bin/chromium
        run: npm run test:browser-ux
