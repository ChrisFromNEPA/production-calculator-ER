name: GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify exact-SHA release gate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          for attempt in $(seq 1 40); do
            checks=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100")
            codeql=$(printf '%s' "$checks" | jq -r '[.check_runs[] | select(.name == "Analyze JavaScript")][0] | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end')
            if [ "$codeql" = "completed:success" ]; then
              break
            fi
            if [ "$codeql" = "completed:failure" ] || [ "$codeql" = "completed:action_required" ] || [ "$codeql" = "completed:cancelled" ]; then
              echo "CodeQL did not pass for $EXPECTED_SHA: $codeql"
              exit 1
            fi
            if [ "$attempt" = 40 ]; then
              echo "Timed out waiting for CodeQL for exact SHA $EXPECTED_SHA (last: $codeql)"
              exit 1
            fi
            sleep 15
          done
          echo "Exact-SHA release gate passed for $EXPECTED_SHA"
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Build Pages artifact
        env:
          PAGES_BASE_PATH: /production-calculator-ER/
        run: npm run build:pages
      - name: Validate generated artifact
        run: test -s dist/index.html && test -s dist/build-manifest.json && grep -q '/production-calculator-ER/' dist/build-manifest.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
